<title>Suppressor 3D</title>
<style>
  :root { --bg: #f4f4f2; --fg: #1b1b1b; --muted: #6b6e73; --line: #d9d9d4; --btn: #1b1b1b; --btn-fg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161617; --fg: #ededeb; --muted: #a0a3aa; --line: #2c2c2f; --btn: #ededeb; --btn-fg: #111; }
  }
  :root[data-theme="dark"] { --bg: #161617; --fg: #ededeb; --muted: #a0a3aa; --line: #2c2c2f; --btn: #ededeb; --btn-fg: #111; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { display: block; width: 100% !important; height: 100% !important; }
  .bar { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 10px;
    align-items: center; justify-content: space-between; flex-wrap: wrap; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .hint { color: var(--muted); font-size: 13px; }
  button { font: inherit; font-size: 14px; border: 0; border-radius: 8px; padding: 9px 14px;
    background: var(--btn); color: var(--btn-fg); cursor: pointer; }
  button.ghost { background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
  .zoom { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
  .zoom button { width: 44px; height: 44px; padding: 0; font-size: 22px; line-height: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
  .zoom button.fit { font-size: 12px; font-weight: 600; }
  .btns { display: flex; gap: 8px; }
  .drag { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg);
    background: color-mix(in srgb, var(--bg) 80%, transparent); font-size: 14px; font-weight: 600; letter-spacing: .02em;
    pointer-events: none; transition: opacity .6s; white-space: nowrap; }
  .drag svg { animation: sway 2.4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
  @media (prefers-reduced-motion: reduce) { .drag svg { animation: none; } }
</style>

<body>
<div id="view" aria-label="3D model of the Outlier 6" suppressor, drag to rotate"></div>

    <path d="M34 13.5 L41 17 L36 22.5"/>
    <path d="M14 34.5 L7 31 L12 25.5"/>
    <path d="M24 12 V36" opacity=".45"/>
  </svg>
  <span>Drag to rotate 360°</span>
</div>
<div class="zoom">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">&minus;</button>
  <button id="zfit" class="fit" aria-label="Reset view">FIT</button>
</div>

  <span class="btns">
    <button class="ghost" id="spin">Pause</button>
    <button id="glb">Download .glb</button>
  </span>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ---------- the part: Outlier 6" suppressor, units = body radius (measured from the photos) ----------
const L = 7.5;                                       // rear face y=0, muzzle y=L
const R_BODY = 1.0, R_REAR = 0.988;                  // body behind the rings is a hair slimmer
const R_THR = 0.86, THR_H = 0.022, THR_PITCH = 0.06, Y_THR = 0.62;   // rear: internal mounting thread
const R_BORE = 0.17, BORE_DEPTH = 3.15, Y_CAV = 2.95;
const HEX_H = 1.05, BOWL_D = 0.55;   // hex nut in the rear cavity: height from the bowl bottom, bowl depth (top ends just under the thread)   // rear cavity: thread, then smooth wall, ~1/3 of the length             // bullet bore from the muzzle: ~6 cm deep (1 unit = 19.05 mm)
const GROOVES = [3.55, 3.91, 4.32, 4.91, 5.32, 5.73, 6.43, 6.86, 7.34];   // disc joints: wide disc + two narrow, repeating (photos)
const FLUTES = 8, FL_Y0 = 0.14, FL_Y1 = 2.45, FL_W = 0.34, FL_D = 1 - Math.cos(0.34);   // 8 flutes, lands ~1/4 of a flute (photo)
const flAng = (k) => (k / FLUTES) * Math.PI * 2 + Math.PI / 2;     // one flute right under the logo, as on the part

let LOD = 1;
function meridian() {
  const P = [];
  const seg = (r0, y0, r1, y1, n, zone) => {
    n = Math.max(2, Math.round(n * (n > 20 ? LOD : 1)));
    for (let i = 0; i < n; i++) { const t = i / n; P.push([r0 + (r1 - r0) * t, y0 + (y1 - y0) * t, zone]); }
  };
  // outside, rear to muzzle
  seg(R_THR + 0.03, 0, R_REAR - 0.02, 0, 8, 'face');
  seg(R_REAR - 0.02, 0, R_REAR, 0.02, 3, 'edge');
  seg(R_REAR, 0.02, R_REAR, FL_Y1 + 0.35, 360, 'flute');            // fluted section, dense rows
  seg(R_REAR, FL_Y1 + 0.35, R_REAR, 3.55, 40, 'body');
  seg(R_REAR, 3.55, R_BODY, 3.57, 2, 'edge');
  seg(R_BODY, 3.57, R_BODY, L - 0.04, 520, 'rings');                 // ring section with the grooves
  seg(R_BODY, L - 0.04, R_BODY - 0.04, L, 4, 'edge');
  // muzzle face, with the bullet hole
  seg(R_BODY - 0.04, L, R_BORE + 0.035, L, 24, 'face');
  seg(R_BORE + 0.035, L, R_BORE, L - 0.035, 4, 'edge');
  // bore back to the baffle, baffle face out to the thread, thread back to the rear
  seg(R_BORE, L - 0.035, R_BORE, Y_CAV + BOWL_D - HEX_H - 0.03, 200, 'bore');       // bullet bore, straight through, smooth inside
  // first baffle: a raised six-sided boss with the bullet hole through it, flat face around
  seg(R_BORE, Y_CAV, R_BORE + 0.03, Y_CAV, 3, 'boss');
  seg(R_BORE + 0.03, Y_CAV, R_THR - 0.03, Y_CAV, 160, 'boss');
  seg(0.80, Y_CAV, R_THR - 0.03, Y_CAV, 4, 'baffle');              // flat baffle face out to the wall
             // flat baffle face out to the wall
  seg(R_THR - 0.03, Y_CAV, R_THR, Y_CAV - 0.03, 3, 'edge');
  seg(R_THR, Y_CAV - 0.03, R_THR, Y_THR, 60, 'wall');               // smooth bore wall after the thread
  seg(R_THR, Y_THR, R_THR, 0.03, 120, 'thread');
  seg(R_THR, 0.03, R_THR + 0.03, 0, 3, 'edge');
  return P;
}

const tri = (x) => { const f = x - Math.floor(x); return 1 - Math.abs(2 * f - 1); };

function angles(NT) {
  // plain, evenly spaced columns: no extra slivers (they showed up as thin lines along the body)
  const A = [];
  for (let j = 0; j < NT; j++) A.push((j / NT) * Math.PI * 2);
  return A;
}

let FL_RAMP = 0;                                  // how far into the end ramp the last sample was (for shading)
function fluteR(th, y, r0) {
  FL_RAMP = 0;
  // flat milled flute. Long sides: the flat simply meets the round body (untouched).
  // Narrow rounded ends only: the floor curves up smoothly to the rim, measured along the axis.
  for (let k = 0; k < FLUTES; k++) {
    const ph = Math.atan2(Math.sin(th - flAng(k)), Math.cos(th - flAng(k)));
    if (Math.abs(ph) >= FL_W) continue;
    const plane = (r0 - FL_D) / Math.cos(ph);
    const y0 = FL_Y0 + FL_W, y1 = FL_Y1 - FL_W;
    const half = Math.sqrt(Math.max(0, FL_W * FL_W - ph * ph));      // end cap outline at this angle
    const lo = y0 - half, hi = y1 + half;
    if (y <= lo || y >= hi) return r0;
    const RAMP = 0.36;                                                    // ramp runs from the very tip of the end ...
    const q = Math.min(1, (y - (y0 - FL_W)) / RAMP, ((y1 + FL_W) - y) / RAMP,   // ... to a straight line across the flute
                       (y - lo) / 0.16, (hi - y) / 0.16);                     // and no step along the rounded rim
    const e = 1 - (1 - q) * (1 - q);                                    // smooth curve up at the ends
    FL_RAMP = q < 1 ? Math.sin(q * Math.PI) : 0;
    return Math.min(r0, r0 + (plane - r0) * e);
  }
  return r0;
}

function buildGeometry(NT) {
  const M = meridian(), NM = M.length, TH = angles(NT);
  NT = TH.length;
  const pos = new Float32Array(NM * NT * 3), col = new Float32Array(NM * NT * 3), dark = new Uint8Array(NM * NT);
  let k = 0;
  for (let j = 0; j < NT; j++) {
    const th = TH[j], c = Math.cos(th), s = Math.sin(th);
    for (let i = 0; i < NM; i++) {
      let [r, y, zone] = M[i], shade = 1.0, dk = 0;
      if (zone === 'flute') { const r0 = r; r = fluteR(th, y, r); shade = 1 - 0.18 * Math.min(1, (r0 - r) / FL_D) + 0.55 * FL_RAMP; }   // the end ramps catch the light   // flute floor a shade darker, as on the photo
      else if (zone === 'rings') {
        let n = 0; for (const g of GROOVES) if (y > g) n++;             // disc number counted from the logo end
        if (n === 3 || n === 6) r -= 0.016;                                 // the two wide discs sit slightly lower
        for (const g of GROOVES) {                                          // fine joint between two flat discs
          const d = Math.abs(y - g);
          if (d < 0.006) { r -= 0.014; shade = 0.45; }
          else if (d < 0.016) { const t = (0.016 - d) / 0.010; r -= 0.012 * t * t; shade = 1.0 + 0.2 * t; }
        }
      } else if (zone === 'thread') {
        const w = tri(y / THR_PITCH + th / (Math.PI * 2));
        r = R_THR + THR_H * (1 - w); shade = 0.55 + 0.35 * w;
      } else if (zone === 'boss') {
        // as on the photos: the cavity wall rolls down into a round bowl, a hex nut stands in the middle:
        // six flat sides, chamfered top corners, a large flat round face, bullet hole through the centre
        dk = 1;
        const seg6 = Math.PI / 3, a = ((th % seg6) + seg6) % seg6 - seg6 / 2;
        const sm = (t) => t * t * (3 - 2 * t);
        const RW = R_THR - 0.03;
        // photos IMG_9091-9096: a tall straight hex prism stands in a deep round bowl; its top corners are chamfered
        // into a flat round face; where the flat sides cut into the rising bowl they leave arcs, higher at the corners
        const AP_T = 0.36, AP_B = 0.60, R_C = 0.35;                     // hex: narrow at the top, wide where it comes out of the bowl
        let sumE = 0; for (let j = 0; j < 6; j++) sumE += Math.exp(70 * r * Math.cos(th - Math.PI / 6 - j * Math.PI / 3));
        const dh = Math.log(sumE) / 70;                                 // hex distance, corners just softened
        const hRound = HEX_H - Math.max(0, r - R_C) * 0.9;              // chamfered top corners
        const ca = ((th % (Math.PI / 3)) + Math.PI / 3) % (Math.PI / 3), cf = Math.pow(1 - Math.min(ca, Math.PI / 3 - ca) / (Math.PI / 6), 3);
        const q0 = Math.min(1, Math.max(0, (dh - AP_T) / (AP_B - AP_T)));
        const sideF = Math.sin(3 * Math.min(ca, Math.PI / 3 - ca));     // 0 at a corner, 1 mid-side
        const dh2 = dh * (1 - 0.09 * cf * q0) * (1 + 0.02 * sideF * sideF);   // corner ridges into the bowl; every side an arc bowed in, top to bottom
        const qh = Math.min(1, Math.max(0, (dh2 - AP_T) / (AP_B - AP_T)));
        const hexP = Math.min(hRound, HEX_H * (1 - qh) * (1 - qh));    // tapers to the top; sides bowed in (concave), flaring into the bowl
        const u = Math.min(1, Math.max(0, (r - 0.15) / (RW - 0.15)));
        const fl = BOWL_D * (1 - Math.sqrt(1 - u * u));                 // bowl: rises steeper and steeper into the wall
        const kS = 0.30, hS = Math.max(kS - Math.abs(hexP - fl), 0) / kS, s = Math.max(hexP, fl) + hS * hS * kS / 4;   // wide round fillet: the hex melts smoothly into the bowl
        y = r < R_BORE + 0.031 ? Y_CAV + BOWL_D - HEX_H : Y_CAV + BOWL_D - Math.min(s, HEX_H);
      } else if (zone === 'bore' || zone === 'baffle') {
        dk = 1;
      }
      pos[k] = r * c; pos[k + 1] = y; pos[k + 2] = r * s;
      col[k] = col[k + 1] = col[k + 2] = shade; dark[k / 3] = dk; k += 3;
    }
  }
  const idx = [], idxD = [];
  for (let j = 0; j < NT; j++) for (let i = 0; i < NM; i++) {
    const jn = (j + 1) % NT, a = j * NM + i, b = j * NM + (i + 1) % NM, c2 = jn * NM + i, d = jn * NM + (i + 1) % NM;
    (dark[a] + dark[b] + dark[c2] + dark[d] >= 3 ? idxD : idx).push(a, c2, b, b, c2, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(idx.concat(idxD));
  g.clearGroups(); g.addGroup(0, idx.length, 0); g.addGroup(idx.length, idxD.length, 1);
  g.computeVertexNormals();
  return g;
}

// the white OUTLIER mark, wrapped on the body between the flutes and the rings
const LOGO_Y = 3.0, LOGO_ARC = 1.08, LOGO_H = 0.56, LOGO_TH = Math.PI / 2;
function logoGeometry() {
  const NU = 60, NV = 8, P = [], UV = [], I = [];
  for (let v = 0; v <= NV; v++) for (let u = 0; u <= NU; u++) {
    const fu = u / NU, fv = v / NV, ph = LOGO_TH - (fu - 0.5) * LOGO_ARC, r = R_REAR + 0.003;
    P.push(r * Math.cos(ph), LOGO_Y + (fv - 0.5) * LOGO_H, r * Math.sin(ph)); UV.push(fu, fv);
  }
  for (let v = 0; v < NV; v++) for (let u = 0; u < NU; u++) {
    const a = v * (NU + 1) + u, b = a + 1, c = a + NU + 1, d = c + 1; I.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(UV, 2));
  g.setIndex(I); g.computeVertexNormals(); return g;
}

// ---------- scene ----------
const el = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
el.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const material = new THREE.MeshPhysicalMaterial({
  color: 0x1f2023, metalness: 0.3, roughness: 0.62, clearcoat: 0.0, specularIntensity: 0.5,   // matte bead-blasted anodising, as on the part
  vertexColors: true, side: THREE.DoubleSide,
});
material.name = 'anodized black';
const holeMat = new THREE.MeshStandardMaterial({ color: 0x030304, metalness: 0.0, roughness: 1.0, envMapIntensity: 0.25, side: THREE.DoubleSide });   // inside: dark, flat light, so the nut barely shows
holeMat.name = 'hole interior';
holeMat.onBeforeCompile = (sh) => {                                 // cavity + hex: soft light, no bright glints on the hex sides
  sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>', 'outgoingLight *= 0.42;\n#include <opaque_fragment>');

const logoTex = new THREE.TextureLoader().load(LOGO_URI); logoTex.colorSpace = THREE.SRGBColorSpace; logoTex.anisotropy = 8;

const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 100);
camera.position.set(0, 0.9, 4.9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 2.2; controls.maxDistance = 30;
controls.autoRotate = false;

// idle show: turn round and tip over, so the flat end, the holes and the cup all come round
let idle = true, idleTimer = null, paused = false, t = 0;
function pose(t) { pivot.rotation.set(0.25 + 0.35 * Math.sin(t * 0.45), t, 0); }   // turntable, gently tipping so both ends show
const spinBtn = document.getElementById('spin');
const dragHint = document.getElementById('drag');
controls.addEventListener('start', () => { idle = false; clearTimeout(idleTimer); dragHint.style.opacity = '0'; });
controls.addEventListener('end', () => { idleTimer = setTimeout(() => { if (!paused) idle = true; dragHint.style.opacity = '1'; }, 3000); });
spinBtn.onclick = () => { paused = !paused; idle = !paused; spinBtn.textContent = paused ? 'Rotate' : 'Pause'; };

function resize() {
  const w = el.clientWidth, h = el.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  camera.fov = w < h ? 42 : 30; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
// zoom buttons and fit: the whole part always fits the window, whatever its shape
function fitDistance() {
  const vFov = THREE.MathUtils.degToRad(camera.fov), hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const r = 4.9;                                          // half the length plus room for the buttons
  return Math.max(r / Math.sin(Math.min(vFov, hFov) / 2), 2.2);
}
function setDistance(d) {
  d = Math.min(controls.maxDistance, Math.max(controls.minDistance, d));
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, d); controls.update();
}
const dist = () => camera.position.distanceTo(controls.target);
document.getElementById('zin').onclick = () => setDistance(dist() / 1.25);
document.getElementById('zout').onclick = () => setDistance(dist() * 1.25);

  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);

// ---------- .glb (real size: body 1.5 in = 38.1 mm across, 6 in class length) ----------
function outwardFaces(g) {
  const pa = g.attributes.position.array, na = g.attributes.normal.array;
  let probe = -1, best = 0;
  for (let v = 0; v < pa.length / 3; v++) { const r = Math.hypot(pa[v * 3], pa[v * 3 + 2]); if (r > best) { best = r; probe = v; } }
  if (na[probe * 3] * pa[probe * 3] + na[probe * 3 + 2] * pa[probe * 3 + 2] < 0) {
    const ix = g.index.array;
    for (let i = 0; i < ix.length; i += 3) { const t = ix[i + 1]; ix[i + 1] = ix[i + 2]; ix[i + 2] = t; }
    g.index.needsUpdate = true; g.computeVertexNormals();
  }
}
function exportGLB() {
  LOD = 0.6; const g = buildGeometry(400); LOD = 1;
  outwardFaces(g);
  const bm = material.clone(); bm.color.set(0x3a3c40);
  const grp = new THREE.Group(); grp.name = 'Outlier 6in suppressor';
  const b = new THREE.Mesh(g, [bm, holeMat.clone()]); b.name = 'body';
  const lg = new THREE.Mesh(logoGeometry(), logoMat); lg.name = 'logo';
  grp.add(b, lg); grp.scale.setScalar(0.01905); grp.position.y = 0;

}
document.getElementById('glb').onclick = () => {
  const a = document.createElement('a'); a.href = 'outlier-suppressor-6.glb'; a.download = 'outlier-suppressor-6.glb'; a.click();
};
